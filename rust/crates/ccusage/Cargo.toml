[package]
name = "ccusage"
version = "20.0.6"
edition = "2021"
build = "build.rs"

[[bin]]
name = "ccusage"
path = "src/main.rs"

[[bin]]
name = "generate-config-schema"
path = "src/bin/generate_config_schema.rs"

[dependencies]
ccusage-cli = { path = "../ccusage-cli" }
ccusage-terminal = { path = "../ccusage-terminal" }
jiff = { version = "0.2.24", default-features = false, features = [
	"std",
	"tz-system",
	"tzdb-zoneinfo",
] }
memchr = "2"
compact_str = "0.9"
phf = { version = "0.13", features = ["macros"] }
rustc-hash = "2"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: cached report costs must parse back bit-identical; the
# default fast float path can drift by one ULP on cache reads.
serde_json = { version = "1", features = ["float_roundtrip"] }
smallvec = "1"
sqlite = { version = "0.37.0", default-features = false, features = ["bundled", "linkage"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[build-dependencies]
minreq = { version = "3.0.0-rc.1", default-features = false, features = ["https-rustls"] }
# float_roundtrip: cached report costs must parse back bit-identical; the
# default fast float path can drift by one ULP on cache reads.
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = "0.1.50"

[dev-dependencies]
ccusage-test-support = { path = "../ccusage-test-support" }
insta = { version = "1.47.2", features = ["json"] }
